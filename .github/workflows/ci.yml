name: Build installable APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Optional APK versionName override
        required: false
        type: string
      version_code:
        description: Optional APK versionCode override
        required: false
        type: string
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build-release-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      SIGNER_CERT_SHA256: a73b1a3459fb842f8a39c86ef0fe29e496486361db032085d3345b6b97dd3395

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require versioned notes for a new Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/verify_release_notes.py --tag "$GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This tag already has a Release. Publish a new version instead of replacing assets.' >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure optional signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo 'Release tags require the long-term signing key.' >&2
              exit 1
            fi
            echo "No signing secrets configured; using the generated debug key."
            exit 0
          fi
          printf '%s' "$SIGNING_KEY" | base64 --decode > release.keystore
          {
            printf 'STORE_FILE_PATH=../release.keystore\n'
            printf 'STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } > local.properties

      - name: Build installable release APK
        env:
          REQUESTED_VERSION_NAME: ${{ inputs.version_name }}
          REQUESTED_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          chmod +x gradlew
          version_name="actions-${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version_name="${GITHUB_REF_NAME#v}"
          fi
          if [ -n "$REQUESTED_VERSION_NAME" ]; then
            version_name="$REQUESTED_VERSION_NAME"
          fi

          gradle_args=(-PversionName="$version_name")
          if [ -n "$REQUESTED_VERSION_CODE" ]; then
            gradle_args+=(-PversionCode="$REQUESTED_VERSION_CODE")
          fi
          ./gradlew --build-cache --stacktrace \
            "${gradle_args[@]}" \
            :app:assembleRelease

      - name: Verify Modern API 102 artifact
        shell: bash
        run: |
          set -euo pipefail
          module_prop='app/src/main/resources/META-INF/xposed/module.prop'
          if [ ! -f "$module_prop" ]; then
            echo 'Legacy branch detected; skipping Modern-only checks.'
            exit 0
          fi

          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one release APK, found ${#apks[@]}." >&2
            exit 1
          fi
          apk="${apks[0]}"
          entries="$(unzip -Z1 "$apk")"

          for entry in \
            META-INF/xposed/java_init.list \
            META-INF/xposed/module.prop \
            META-INF/xposed/scope.list; do
            grep -Fxq "$entry" <<<"$entries" || {
              echo "Missing Modern module entry: $entry" >&2
              exit 1
            }
          done
          if grep -Fxq 'assets/xposed_init' <<<"$entries"; then
            echo 'Legacy assets/xposed_init must not be packaged.' >&2
            exit 1
          fi

          unzip -p "$apk" META-INF/xposed/module.prop > packaged-module.prop
          grep -Fxq 'minApiVersion=102' packaged-module.prop
          grep -Fxq 'targetApiVersion=102' packaged-module.prop
          grep -Fxq 'staticScope=false' packaged-module.prop

          badging="$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk")"
          expected_package="$(sed -n 's/.*APPLICATION_ID = "\([^"]*\)"/\1/p' build.gradle)"
          if [ -z "$expected_package" ]; then
            echo 'Unable to determine expected application ID.' >&2
            exit 1
          fi
          grep -Fq "package: name='$expected_package'" <<<"$badging"
          grep -Fq "application-label:'Pixel MiPush'" <<<"$badging"
          manifest_tree="$("$ANDROID_HOME/build-tools/34.0.0/aapt" \
            dump xmltree "$apk" AndroidManifest.xml)"
          if grep -Eq 'xposedmodule|xposedminversion|xposedscope' <<<"$manifest_tree"; then
            echo 'Legacy Xposed manifest metadata must not be packaged.' >&2
            exit 1
          fi

          unzip -p "$apk" 'classes*.dex' > packaged-classes.dex
          strings packaged-classes.dex > packaged-dex-strings.txt
          if grep -Eq 'de[./]robv[./]android[./]xposed' packaged-dex-strings.txt; then
            echo 'Legacy de.robv.android.xposed reference found in release DEX.' >&2
            exit 1
          fi

          # Tag builds verify signatures once while staging the Release assets.
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            signer_output="$("$ANDROID_HOME/build-tools/34.0.0/apksigner" \
              verify --verbose --print-certs "$apk")"
            if [ -f release.keystore ]; then
              grep -Fqi "Signer #1 certificate SHA-256 digest: $SIGNER_CERT_SHA256" <<<"$signer_output"
            fi
          fi

      - name: Stage Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -eq 1
          python3 scripts/prepare_release.py --tag "$GITHUB_REF_NAME" \
            --project PixelMiPush --repository "$GITHUB_REPOSITORY" \
            --certificate "$SIGNER_CERT_SHA256" --tools "$ANDROID_HOME/build-tools/34.0.0" \
            --apk "default=${apks[0]}"

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then release_args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" "${release_args[@]}" --notes-file build/release/release-notes.md dist/*.apk dist/*.sha256

      - name: Remove decoded signing material
        if: always()
        run: rm -f release.keystore local.properties

      - name: Name artifact
        id: artifact
        shell: bash
        run: echo "name=Pixel-MiPush-${GITHUB_SHA::7}-release" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
